<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep navy 3D squircle background -->
    <linearGradient id="bgGrad" x1="64" y1="36" x2="452" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09152E"/>
      <stop offset="48%" stop-color="#0D2249"/>
      <stop offset="100%" stop-color="#143870"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="54%">
      <stop offset="0%" stop-color="#22559E" stop-opacity="0.48"/>
      <stop offset="65%" stop-color="#0D234A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060F24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimHighlight" x1="256" y1="20" x2="256" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 3D Shield gradients -->
    <linearGradient id="shieldBody" x1="256" y1="78" x2="256" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4278" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#112B54" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#0A1A38" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="shieldStroke3D" x1="150" y1="84" x2="368" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#76F9C5"/>
      <stop offset="45%" stop-color="#23C58D"/>
      <stop offset="100%" stop-color="#0E885F"/>
    </linearGradient>

    <!-- 3D Glossy C letterform gradients -->
    <linearGradient id="cExtrude" x1="256" y1="168" x2="256" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F7A56"/>
      <stop offset="100%" stop-color="#064531"/>
    </linearGradient>
    <linearGradient id="cFace3D" x1="196" y1="158" x2="310" y2="358" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86FFD0"/>
      <stop offset="38%" stop-color="#41E8AA"/>
      <stop offset="78%" stop-color="#18B47D"/>
      <stop offset="100%" stop-color="#0E8B60"/>
    </linearGradient>
    <linearGradient id="cSpecular" x1="220" y1="158" x2="265" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="60%" stop-color="#B8FFE4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <!-- Keyhole recessed 3D mint-ice -->
    <linearGradient id="keyholeGrad" x1="256" y1="228" x2="256" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FFF8"/>
      <stop offset="60%" stop-color="#CFFFE9"/>
      <stop offset="100%" stop-color="#8DF3C8"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square 3D tile -->
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bgGlow)"/>
  <rect x="21" y="21" width="470" height="470" rx="109" stroke="url(#rimHighlight)" stroke-width="5"/>

  <!-- Soft 3D drop shadow under shield -->
  <path d="M256 96L398 148V252C398 346 338 416 256 446C174 416 114 346 114 252V148L256 96Z" fill="#040A19" fill-opacity="0.58"/>

  <!-- 3D extruded bottom bevel of shield -->
  <path d="M256 84L394 134V242C394 334 335 403 256 433C177 403 118 334 118 242V134L256 84Z" stroke="#084D37" stroke-width="14" stroke-linejoin="round"/>

  <!-- Main sculpted shield plate & luminous emerald border -->
  <path d="M256 78L394 128V236C394 328 335 397 256 427C177 397 118 328 118 236V128L256 78Z" fill="url(#shieldBody)" stroke="url(#shieldStroke3D)" stroke-width="10" stroke-linejoin="round"/>
  <!-- Inner specular rim on shield -->
  <path d="M256 87L384 133V236C384 322 329 387 256 416C183 387 128 322 128 236V133L256 87Z" stroke="#A7F3D0" stroke-opacity="0.22" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 3D Ambient shadow beneath the C -->
  <path d="M312 204C297 183 274 172 246 172C195 172 158 210 158 262C158 314 195 352 246 352C274 352 298 341 313 319" stroke="#030917" stroke-opacity="0.58" stroke-width="56" stroke-linecap="round"/>

  <!-- 3D Extruded thickness edge of the C (shifted down/right) -->
  <path d="M310 200C295 179 272 168 244 168C193 168 156 206 156 258C156 310 193 348 244 348C272 348 296 337 311 315" stroke="url(#cExtrude)" stroke-width="50" stroke-linecap="round"/>

  <!-- 3D Main glossy C face -->
  <path d="M308 192C293 171 270 160 242 160C191 160 154 198 154 250C154 302 191 340 242 340C270 340 294 329 309 307" stroke="url(#cFace3D)" stroke-width="48" stroke-linecap="round"/>

  <!-- Top specular bevel highlight along the C -->
  <path d="M305 186C290 167 268 156 242 156C195 156 160 191 158 239" stroke="url(#cSpecular)" stroke-width="18" stroke-linecap="round"/>

  <!-- Keyhole recessed shadow + bright 3D keyhole -->
  <circle cx="256" cy="240" r="19" fill="#050C1E" fill-opacity="0.62"/>
  <path d="M244 253H268L275 299H237L244 253Z" fill="#050C1E" fill-opacity="0.62"/>

  <circle cx="256" cy="236" r="17" fill="url(#keyholeGrad)"/>
  <path d="M245 247H267L273 293H239L245 247Z" fill="url(#keyholeGrad)"/>
  <circle cx="253" cy="232" r="5" fill="#FFFFFF" fill-opacity="0.65"/>
</svg>
